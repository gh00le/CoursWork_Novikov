name: Frontend CI

on:
  push:
    paths:
      - "spa/**"
      - "mpa/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "spa/**"
      - "mpa/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [spa, mpa]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "${{ matrix.project }}/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
