name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coursework
          POSTGRES_PASSWORD: coursework_dev_password
          POSTGRES_DB: coursework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursework -d coursework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test database
        run: PGPASSWORD=coursework_dev_password psql -h localhost -U coursework -d coursework -c "CREATE DATABASE coursework_test;"
        env:
          PGPASSWORD: coursework_dev_password

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Flake8 check
        working-directory: backend
        run: flake8 app tests

      - name: Pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://coursework:coursework_dev_password@localhost:5432/coursework_test
        run: pytest

      - name: Build Docker image
        run: docker build -t coursework-backend ./backend
