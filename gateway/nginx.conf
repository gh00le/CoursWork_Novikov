upstream spa_frontend { server spa:80; }
upstream mpa_frontend { server mpa:3000; }
upstream shared_api { server backend:8000; }

server {
    listen 80;
    server_name _;

    location = /_gateway/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Единый публичный API: оба интерфейса работают через этот маршрут.
    location ^~ /api/ {
        proxy_pass http://shared_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health { proxy_pass http://shared_api; }
    location = /health/cache { proxy_pass http://shared_api; }
    location = /docs { proxy_pass http://shared_api; }
    location = /openapi.json { proxy_pass http://shared_api; }

    location = /mpa {
        proxy_pass http://mpa_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /mpa/ {
        proxy_pass http://mpa_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://spa_frontend;
        proxy_set_header Host $host;
    }
}
